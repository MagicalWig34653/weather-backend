version: '3.8'
# Swarm stack for the ShowerNow radar cache: stateless API replicas plus a one-shot migration service.
# Every replica serves the HTTP API from MariaDB and takes part in the ingest; a claim row in the database
# ensures that exactly one replica fetches each 5-minute DWD run (see docs/decisions.md).
# MariaDB is EXTERNAL (not part of this stack). TLS and the reverse proxy are external, too. No Redis.
# Configure via .env in the repository root (written by deploy/swarm/setup.sh, see .env.example)
# and the external Swarm secret referenced at the bottom.
x-radar: &radar
  image: ghcr.io/magicalwig34653/weather-backend-radar:${RADAR_IMAGE_TAG:-edge}
  networks: [internal]
  environment: &environment
    DB_HOST: ${DB_HOST:?DB_HOST required}
    DB_PORT: ${DB_PORT:-3306}
    DB_NAME: ${DB_NAME:-showernow}
    DB_USER: ${DB_USER:-showernow}
    DB_PASSWORD_FILE: /run/secrets/db_password
    DB_POOL_SIZE: ${DB_POOL_SIZE:-4}
    CACHE_MAX_MB: ${CACHE_MAX_MB:-64}
    RETENTION_RUNS: ${RETENTION_RUNS:-16}
    HISTORY_HOURS: ${HISTORY_HOURS:-48}
    LAYERS: ${LAYERS:-radar}
    PRESSURE_FORECAST_HOURS: ${PRESSURE_FORECAST_HOURS:-48}
    PRESSURE_RETENTION_RUNS: ${PRESSURE_RETENTION_RUNS:-2}
    LIGHTNING_HISTORY_HOURS: ${LIGHTNING_HISTORY_HOURS:-3}
    CLOUDS_HISTORY_HOURS: ${CLOUDS_HISTORY_HOURS:-3}
    CLOUDMASK_HISTORY_HOURS: ${CLOUDMASK_HISTORY_HOURS:-3}
    LAYER_PAUSE_SECONDS: ${LAYER_PAUSE_SECONDS:-2}
    FETCH_WORKERS: ${FETCH_WORKERS:-3}
    USER_AGENT: ${USER_AGENT:-ShowerNow-radar-ingest/1.0}
    WMS_URL: ${WMS_URL:-https://maps.dwd.de/geoserver/ows}
    OPERATOR_NAME: ${OPERATOR_NAME:-}
    OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
    OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
    PROXY_LOG_NOTE: ${PROXY_LOG_NOTE:-}
    APP_STORE_URL: ${APP_STORE_URL:-}
    TESTFLIGHT_URL: ${TESTFLIGHT_URL:-}
  secrets: [db_password]
services:
  migrate:
    <<: *radar
    command: [migrate, --yes]
    deploy:
      replicas: 0
      restart_policy:
        condition: none
  radar:
    <<: *radar
    command: [serve]
    configs:
      - source: healthcheck
        target: /healthcheck.sh
        mode: 0555
    healthcheck:
      test: [CMD, /bin/bash, /healthcheck.sh]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    ports:
      # Ingress port for the external reverse proxy (TLS there).
      - target: 8080
        published: ${RADAR_PORT:-38090}
        protocol: tcp
        mode: ingress
    deploy:
      replicas: ${RADAR_REPLICAS:-2}
      resources:
        limits:
          cpus: '${RADAR_CPU_LIMIT:-0}'
          memory: ${RADAR_MEMORY_LIMIT:-0}
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
networks:
  internal:
    driver: overlay
    attachable: true
configs:
  healthcheck:
    file: ./healthcheck.sh
secrets:
  db_password:
    external: true
    name: ${DB_PASSWORD_SECRET:-showernow_db_password}
