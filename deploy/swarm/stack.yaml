# Swarm stack for the ShowerNow radar cache (stage 1). One stateless service, >= 2 replicas.
# Every replica serves the HTTP API from MariaDB and takes part in the ingest; a claim row in the database
# ensures that exactly one replica fetches each 5-minute DWD run (see docs/decisions.md).
# MariaDB is EXTERNAL (not part of this stack). No Redis. TLS and the reverse proxy are external, too.
# Configure via deploy/swarm/stack.env (copy stack.env.example, fill, `set -a; . stack.env; set +a`).
services:
  radar:
    image: ${RADAR_IMAGE:-ghcr.io/OWNER/showernow-radar}:${RADAR_IMAGE_TAG:-latest}
    networks: [internal]
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST required}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-showernow}
      DB_USER: ${DB_USER:-showernow}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_POOL_SIZE: ${DB_POOL_SIZE:-4}
      CACHE_MAX_MB: ${CACHE_MAX_MB:-64}
      RETENTION_RUNS: ${RETENTION_RUNS:-16}
      FETCH_WORKERS: ${FETCH_WORKERS:-3}
      USER_AGENT: ${USER_AGENT:-ShowerNow-radar-ingest/1.0}
    secrets: [db_password]
    ports:
      # Ingress port for the external reverse proxy (TLS there). Example labels for proxies that read
      # Swarm labels (placeholder domain, adapt to your proxy) would go under deploy.labels:
      #   - traefik.enable=true
      #   - traefik.http.routers.radar.rule=Host(`radar.example.org`)
      #   - traefik.http.services.radar.loadbalancer.server.port=8080
      - target: 8080
        published: ${RADAR_PORT:-38090}
        protocol: tcp
        mode: ingress
    healthcheck:
      test: [CMD, python, -m, radar_ingest, healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      replicas: ${RADAR_REPLICAS:-2}
      resources:
        limits:
          cpus: '${RADAR_CPU_LIMIT:-0.5}'
          memory: ${RADAR_MEMORY_LIMIT:-256M}
        reservations:
          memory: 96M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 0
networks:
  internal:
    driver: overlay
secrets:
  db_password:
    external: true
    name: ${DB_PASSWORD_SECRET:-showernow_db_password}
