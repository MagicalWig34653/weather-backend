name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift build and tests (MariaDB 12.3, no DWD access)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: ci-only
          MARIADB_DATABASE: radar_test
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: System libraries
        run: apt-get update && apt-get install -y --no-install-recommends pkg-config libwebp-dev
      - name: Build
        run: swift build
      - name: Test (contract tests against the fake and MariaDB)
        run: swift test
        env:
          RADAR_TEST_DB_HOST: mariadb
          RADAR_TEST_DB_PASSWORD: ci-only

  dashboard:
    name: Dashboard (SvelteKit, statischer Build)
    runs-on: ubuntu-24.04
    container: node:26-slim@sha256:e4db4c914bf8ad241bd24804fc25d272d89bad97e68cdc8a1414862790a02c39
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit (Produktionsabhaengigkeiten; Befund nur als Warnung)
        run: npm audit --omit=dev || echo "::warning::npm audit meldet Befunde (nur Build-Werkzeuge, siehe dashboard/README.md)"

  deploy-files:
    name: Shell scripts and stack file
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: shellcheck -x -P SCRIPTDIR deploy/swarm/*.sh
      - name: Swarm deploy script (stub docker, push and dashboard overlays)
        run: bash deploy/swarm/test-swarm-deploy.sh
      - name: settings.sh (whiptail stub, quoting, backups, check)
        run: bash deploy/swarm/test-settings.sh
      - name: Settings tables match stack.yaml and .env.example
        run: bash deploy/swarm/check-config-tables.sh
      - name: Validate the stack file and the dev compose file
        run: |
          DB_HOST=db.example.internal docker compose -f deploy/swarm/stack.yaml config --quiet
          docker compose -f compose.yaml config --quiet
          # Dashboard overlay: valid together with the stack; exactly one published ingress port (target = dashboard port), hardened service.
          DB_HOST=db.example.internal DASH_ORIGIN=https://dash.example.internal docker compose -f deploy/swarm/stack.yaml -f deploy/swarm/stack.dashboard.yaml config --format json \
            | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]["dashboard"]; p=s.get("ports", []); assert len(p) == 1, p; assert p[0]["mode"] == "ingress" and p[0]["target"] == 9090 and p[0]["published"] == "39090", p; assert s.get("read_only") is True; assert s["environment"]["PUSH_ENABLED"] == "false"; assert s["environment"]["DASH_PORT"] == "9090"; assert "APNS_KEY_FILE" not in s["environment"]; assert all("docker.sock" not in str(v) for v in s.get("volumes", [])); assert [x["source"] for x in s["secrets"]] == ["db_password"]'
          # Non-default ports: target follows DASH_PORT, published follows DASH_PUBLISH_PORT.
          DB_HOST=db.example.internal DASH_ORIGIN=https://dash.example.internal DASH_PORT=9191 DASH_PUBLISH_PORT=41000 docker compose -f deploy/swarm/stack.yaml -f deploy/swarm/stack.dashboard.yaml config --format json \
            | python3 -c 'import json,sys; p=json.load(sys.stdin)["services"]["dashboard"]["ports"]; assert len(p) == 1 and p[0]["target"] == 9191 and p[0]["published"] == "41000" and p[0]["mode"] == "ingress", p'
