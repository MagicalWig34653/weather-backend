name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: radar_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Unit and MariaDB integration tests (no DWD access)
        run: python -m unittest discover -s . -t . -v
        env:
          RADAR_TEST_DB_PORT: "3306"

  deploy-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: shellcheck deploy/swarm/*.sh
      - name: Validate the stack file
        run: |
          cp deploy/swarm/stack.env.example /tmp/stack.env
          set -a; . /tmp/stack.env; set +a
          docker compose -f deploy/swarm/stack.yaml config --quiet
