name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift build and tests (MariaDB 12.3, no DWD access)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: ci-only
          MARIADB_DATABASE: radar_test
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: System libraries
        run: apt-get update && apt-get install -y --no-install-recommends pkg-config libwebp-dev
      - name: Build
        run: swift build
      - name: Test (contract tests against the fake and MariaDB)
        run: swift test
        env:
          RADAR_TEST_DB_HOST: mariadb
          RADAR_TEST_DB_PASSWORD: ci-only

  deploy-files:
    name: Shell scripts and stack file
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: shellcheck -x -P SCRIPTDIR deploy/swarm/*.sh scripts/*.sh
      - name: Validate the stack file and the dev compose file
        run: |
          DB_HOST=db.example.internal docker compose -f deploy/swarm/stack.yaml config --quiet
          docker compose -f compose.yaml config --quiet
