<!doctype html>
<html lang="de">

		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="referrer" content="no-referrer" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/icons/icon-32.png" />
		<link rel="icon" type="image/png" sizes="48x48" href="%sveltekit.assets%/icons/icon-48.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#2f4fd8" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="false">
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
